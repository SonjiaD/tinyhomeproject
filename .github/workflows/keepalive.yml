name: Keepalive ping

on:
  schedule:
    - cron: '0 8 */5 * *'   # every 5 days at 08:00 UTC
  workflow_dispatch:          # allow manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (wakes Render + touches Supabase)
        run: |
          curl -fsS "${{ secrets.BACKEND_URL }}/api/ping" \
            --max-time 60 \
            --retry 3 \
            --retry-delay 10 \
            && echo "Ping successful" \
            || echo "Ping failed (non-fatal)"
